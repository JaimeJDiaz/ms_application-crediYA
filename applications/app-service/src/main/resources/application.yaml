server:
  port: ${MS_APPLICATION_PORT:8080}
spring:
  application:
    name: "ms-application"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080,http://localhost:8081"
adapters:
  r2dbc:
    host: "${DB_HOST:localhost}"
    port: "${DB_APPLICATION_PORT:5432}"
    database: "${DB_APPLICATION_NAME:ms_application_db}"
    schema: "${DB_SCHEMA:public}"
    username: "${POSTGRES_USER:crediya_user}"
    password: "${POSTGRES_PASSWORD:StrongPassword123!}"
adapter:
  restconsumer:
    timeout: 5000
    url: "http://localhost:8081"
  sqs:
    region: "${SQS_REGION:us-east-1}"
    queueUrl: "${SQS_QUEUE_URL:http://localstack:4566/000000000000/sample}"
    endpoint: "${SQS_ENDPOINT:http://localstack:4566}"
resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
jwt:
  secret: "clave-super-segura-de-32-caracteres-minimo"
